name: Version check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check code version is greater than the current release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PYEOF'
          import os
          import re
          import subprocess
          import sys

          def changed_filenames():
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              event = os.environ.get("GITHUB_EVENT_NAME", "")
              if event == "pull_request":
                  number = os.environ.get("PR_NUMBER", "")
                  if not number:
                      return None
                  args = ["gh", "api", f"repos/{repo}/pulls/{number}/files",
                          "--paginate", "--jq", ".[].filename"]
              elif event == "push":
                  before = os.environ.get("PUSH_BEFORE", "")
                  sha = os.environ.get("HEAD_SHA", "")
                  if not before or before == "0" * 40 or not sha:
                      return None
                  args = ["gh", "api", f"repos/{repo}/compare/{before}...{sha}",
                          "--jq", ".files[].filename"]
              else:
                  return None
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode != 0:
                  print(f"Could not list changed files; falling back to the strict check: {result.stderr.strip()}")
                  return None
              return [line for line in result.stdout.splitlines() if line]

          filenames = changed_filenames()
          if filenames is not None and not any(name.startswith("harness/") for name in filenames):
              print("OK: no files under harness/ changed, so the shipped code is unchanged; version check skipped.")
              sys.exit(0)

          with open("harness/__init__.py", encoding="utf-8") as f:
              text = f.read()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              print("No __version__ found in harness/__init__.py.")
              sys.exit(1)
          code = match.group(1)

          result = subprocess.run(
              ["gh", "api", "repos/${{ github.repository }}/releases/latest",
               "--jq", ".tag_name"],
              capture_output=True, text=True)
          tag = result.stdout.strip() if result.returncode == 0 else ""
          release = tag[1:] if tag.startswith("v") else tag
          if not release:
              print("No published release found; nothing to compare against.")
              sys.exit(0)

          def parse(version):
              parts = []
              for piece in version.split("."):
                  digits = re.match(r"\d+", piece)
                  parts.append(int(digits.group()) if digits else 0)
              return tuple(parts)

          def pad(version_tuple, length):
              return version_tuple + (0,) * (length - len(version_tuple))

          code_version = parse(code)
          release_version = parse(release)
          width = max(len(code_version), len(release_version))
          if pad(code_version, width) > pad(release_version, width):
              print(f"OK: code version {code} is greater than "
                    f"current release {release}.")
          else:
              print(f"FAIL: code version {code} is not greater than "
                    f"current release {release}.")
              sys.exit(1)
          PYEOF
